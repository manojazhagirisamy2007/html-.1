<!DOCTYPE html>
<html>
<head>
    <title>Class Time Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h2 {
            color: darkblue;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: 2px solid black;
        }

        td {
            padding: 10px;
            border: 2px solid black;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #d6f5d6;
        }
    </style>
</head>

<body>

<h2>CLASS TIME TABLE</h2>

<table>
    <tr>
        <th>Day</th>
        <th>9:00-10:00</th>
        <th>10:00-11:00</th>
        <th>11:00-12:00</th>
        <th>12:00-1:00</th>
        <th>2:00-3:00</th>
        <th>3:00-4:00</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>English</td>
        <td>Maths</td>
        <td>DBMS</td>
        <td rowspan="5">Lunch Break</td>
        <td>Java</td>
        <td>Lab</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>Science</td>
        <td>English</td>
        <td>Maths</td>
        <td>DBMS</td>
        <td>Sports</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>Java</td>
        <td>DBMS</td>
        <td>English</td>
        <td>Maths</td>
        <td>Library</td>
    </tr>

    <tr>
        <td>Thursday</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Java</td>
        <td>English</td>
        <td>Lab</td>
    </tr>

    <tr>
        <td>Friday</td>
        <td>DBMS</td>
        <td>Maths</td>
        <td>Science</td>
        <td>Java</td>
        <td>Seminar</td>
    </tr>

</table>

</body>
</html>
