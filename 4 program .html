<!DOCTYPE html>
<html>
<head>
    <title>Squares and Cubes Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 40%;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        th {
            background-color: lightblue;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Squares and Cubes of Numbers (0 to 10)</h2>

<script>
    document.write("<table>");
    document.write("<tr><th>Number</th><th>Square</th><th>Cube</th></tr>");

    for (let i = 0; i <= 10; i++) {
        document.write("<tr>");
        document.write("<td>" + i + "</td>");
        document.write("<td>" + (i * i) + "</td>");
        document.write("<td>" + (i * i * i) + "</td>");
        document.write("</tr>");
    }

    document.write("</table>");
</script>

</body>
</html>
